srcdoc='
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080700;
  color:#fff;
  font-family:Arial,"Noto Sans Thai",sans-serif;
}

.wrapper{
  padding:10px 12px;
}

/* =========================
   CARD
========================= */

.card{
  border:1px solid #927300;
  border-radius:25px;
  padding:18px;
  margin-bottom:16px;
  background:linear-gradient(
    145deg,
    #191600,
    #090800
  );
  box-shadow:
    inset 0 0 15px rgba(255,210,0,.04),
    0 0 6px rgba(255,190,0,.18);
}

/* =========================
   HEADER
========================= */

.title{
  font-size:21px;
  font-weight:700;
}

.subtitle{
  color:#c5a994;
  font-size:13px;
  margin-top:7px;
}

.dot{
  display:inline-block;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#2cff6a;
  box-shadow:0 0 13px #2cff6a;
  margin-right:9px;
  vertical-align:-1px;
}

.live{
  float:right;
  border:1px solid #a76800;
  border-radius:18px;
  padding:9px 14px;
  font-size:13px;
}

.live span{
  color:#2cff6a;
  margin-right:5px;
}

/* =========================
   TOTAL
========================= */

.amount-box{
  margin-top:18px;
  border:1px solid #927300;
  border-radius:22px;
  padding:20px 22px;
}

.amount{
  font-size:36px;
  font-weight:700;
  color:#ffe000;
  letter-spacing:.2px;
  transition:opacity .2s;
}

.current-time{
  margin-top:27px;
  font-size:13px;
}

.plus{
  float:right;
  border:1px solid #927300;
  border-radius:15px;
  padding:9px 14px;
  color:#ffe000;
  font-size:18px;
  font-weight:bold;
}

.clear{
  clear:both;
}

/* =========================
   TRANSACTIONS
========================= */

.transaction{
  border:1px solid #695600;
  border-radius:18px;
  padding:12px 14px;
  margin-top:10px;
  background:#0d0c06;
  font-size:13px;
  line-height:1.5;

  animation:
    slideIn .45s ease;
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateY(-10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.logo{
  width:45px;
  height:45px;
  border-radius:50%;
  float:left;
  margin-right:12px;

  background:#162e91;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  font-weight:bold;
  color:#fff;

  box-shadow:
    0 0 5px rgba(50,90,255,.5);
}

.info{
  overflow:hidden;
}

.money{
  color:#ffe000;
  font-weight:bold;
}

.success{
  float:right;

  color:#8aff9b;
  background:#123919;

  border:1px solid #245e2d;

  border-radius:12px;

  padding:3px 8px;

  font-size:10px;
}

/* =========================
   DEMO LABEL
========================= */

.demo{
  text-align:center;
  color:#75684f;
  font-size:9px;
  margin-top:8px;
}

</style>
</head>


<body>

<div class="wrapper">

  <!-- =====================
       TOTAL CARD
  ====================== -->

  <div class="card">

    <div class="title">

      <span class="dot"></span>

      ยอดโบนัสสะสม

      <span class="live">
        <span>●</span>LIVE
      </span>

    </div>


    <div class="subtitle">
      อัปเดตอัตโนมัติ • ข้อมูลตัวอย่าง
    </div>


    <div class="amount-box">

      <div
        class="amount"
        id="total"
      >
        7,419,900.71 ฿
      </div>


      <div class="current-time">

        เวลาปัจจุบัน:
        <b id="clock">00:00:00</b>


        <span
          class="plus"
          id="plus"
        >
          +963 ฿
        </span>

      </div>


      <div class="clear"></div>

    </div>

  </div>


  <!-- =====================
       TRANSACTION CARD
  ====================== -->

  <div class="card">

    <div class="title">

      <span class="dot"></span>

      รายการถอนล่าสุด

    </div>


    <div class="subtitle">
      AUTO SYSTEM • อัปเดตต่อเนื่อง
    </div>


    <div id="transactions"></div>

  </div>


  <div class="demo">
    DEMO DATA
  </div>

</div>



<script>

/* ==========================================
   SETTINGS
========================================== */

let total = 7419900.71;

/* ระยะเวลา animation ของยอด */
const smoothDuration = 2500;

/* เพิ่มรายการทุกกี่ ms */
const updateInterval = 3000;


/* ==========================================
   USERS
========================================== */

const users = [

  "xxxx675260xxxx",
  "xxxx370922xxxx",
  "xxxx9912xxxx",
  "xxxx187710xxxx",
  "xxxx542681xxxx",
  "xxxx428916xxxx",
  "xxxx763521xxxx",
  "xxxx318925xxxx"

];


/* ==========================================
   FORMAT MONEY
========================================== */

function formatMoney(number){

  return number.toLocaleString(
    "th-TH",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/* ==========================================
   RANDOM WITHDRAW
========================================== */

function randomAmount(){

  return Math.floor(
    Math.random() * 12000
  ) + 1000;

}


/* ==========================================
   SMOOTH NUMBER ANIMATION
========================================== */

function smoothIncrease(
  targetTotal,
  duration
){

  const startTotal = total;

  const difference =
    targetTotal - startTotal;

  const startTime =
    performance.now();


  function animate(currentTime){

    const elapsed =
      currentTime - startTime;


    let progress =
      Math.min(
        elapsed / duration,
        1
      );


    /*
      Ease In Out
      ทำให้เริ่มช้า
      กลางเร็ว
      จบช้า
    */

    const ease =
      progress < 0.5

      ? 2 * progress * progress

      : 1 -
        Math.pow(
          -2 * progress + 2,
          2
        ) / 2;


    const currentValue =
      startTotal +
      difference * ease;


    document
      .getElementById("total")
      .textContent =
        formatMoney(currentValue)
        + " ฿";


    if(progress < 1){

      requestAnimationFrame(
        animate
      );

    }else{

      total =
        targetTotal;

    }

  }


  requestAnimationFrame(
    animate
  );

}


/* ==========================================
   UPDATE TOTAL
========================================== */

function updateTotal(){

  const add =
    Math.floor(
      Math.random() * 1200
    ) + 200;


  const target =
    total + add;


  document
    .getElementById("plus")
    .textContent =
      "+" +
      add.toLocaleString("th-TH") +
      " ฿";


  smoothIncrease(
    target,
    smoothDuration
  );

}


/* ==========================================
   CLOCK
========================================== */

function updateClock(){

  const now =
    new Date();


  const time =
    now.toLocaleTimeString(
      "th-TH",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );


  document
    .getElementById("clock")
    .textContent =
      time;

}


/* ==========================================
   CREATE TRANSACTION
========================================== */

function createTransaction(){

  const user =
    users[
      Math.floor(
        Math.random() *
        users.length
      )
    ];


  const amount =
    randomAmount();


  const now =
    new Date();


  const time =
    now.toLocaleTimeString(
      "th-TH",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );


  const date =
    now.toLocaleDateString(
      "th-TH",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    );


  const div =
    document.createElement("div");


  div.className =
    "transaction";


  div.innerHTML = `

    <div class="logo">
      ฿
    </div>

    <div class="info">

      ยูส: ${user}

      <br>

      ยอดถอน:
      <span class="money">
        ${amount.toLocaleString("th-TH")}
        บาท
      </span>

      <br>

      วันที่:
      ${date}
      ${time}

      <span class="success">
        สำเร็จ
      </span>

    </div>

    <div class="clear"></div>

  `;


  const list =
    document.getElementById(
      "transactions"
    );


  list.prepend(div);


  /*
    จำกัดไว้ 5 รายการ
  */

  while(
    list.children.length > 5
  ){

    list.removeChild(
      list.lastChild
    );

  }

}


/* ==========================================
   INITIAL DATA
========================================== */

updateClock();


for(
  let i = 0;
  i < 5;
  i++
){

  createTransaction();

}


/* ==========================================
   CLOCK EVERY SECOND
========================================== */

setInterval(
  updateClock,
  1000
);


/* ==========================================
   UPDATE EVERY 3 SECONDS
========================================== */

setInterval(
  function(){

    updateTotal();

    createTransaction();

  },
  updateInterval
);

</script>

</body>
</html>
